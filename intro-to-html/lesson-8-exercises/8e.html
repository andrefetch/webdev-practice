<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uber Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .ride-title {
            margin-top: 0;
            font-size: 30px;
            font-weight: 500;
        }

        .ride-input {
            display: block;
            border: none;
            background-color: #F0F0F0;
            padding: 10px 10px;
            width: 300px;
            margin-bottom: 5px;
            font-size: 10px;
        }
        
        .request-button {
            font-size: 10px;
            font-weight: 400;
            margin-top: 20px;
            background-color: black;
            border: none;
            text-align: center;
            padding: 7px 15px;
            color: white;
            margin-right: 10px;
            cursor: pointer;
        }

        .schedule-button {
            font-size: 10px;
            font-weight: 400;
            margin-top: 20px;
            background-color: #F0F0F0;
            border: none;
            text-align: center;
            padding: 7px 15px;
            color: black;
            margin-right: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p class="ride-title">Request a ride now</p>
    <input class="ride-input" placeholder="Enter pickup location">
    <input class="ride-input" placeholder="Enter destination">
    <button class="request-button">Request now</button>
    <button class="schedule-button">Schedule for later</button>
</body>
</html>
