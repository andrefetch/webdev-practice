<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up form</title>

    <style>
        .name {
            width: 100px;
            height: 10px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
            padding-bottom: 10px;
            padding-top: 10px;
            padding-left: 10px;
            padding-right: 10px;
            border-radius: 4px;
            border-width: 1px;
            border-style: solid;
            margin-bottom: 10px;
        }

        .email {
            display: block;
            font-size: 12px;
            width: 236px;
            padding: 5px;
            border-radius: 4px;
            border-style: solid;
            border-width: 1px;
            margin-bottom: 10px;
        }

        .sign-up-btn {
            width: 248px;
            padding: 10px;
            border-radius: 8px;
            border-style: solid;
            border-width: 1px;
            margin-bottom: 10px;
            color: white;
            border: none;
            background-color: #3975E3;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <input class="name" type="text" placeholder="First name">
    <input class="name" type="text" placeholder="Last name">
    <input class="email" type="text" placeholder="Email">
    <button class="sign-up-btn">Sign Up</button>
</body>
</html>
