<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn SignUp</title>

    <style>
        .email {
            margin-bottom: 5px;
            color: rgb(104, 104, 104);
            font-size: 12px;
        }

        .email-input {
            border-width: 2px;
            border-style: solid;
            border-radius: 2px;
            padding-bottom: 5px;
            width: 250px;
        }

        .policy-statement {
            color: rgb(104, 104, 104);
            font-size: 9.8px;
        }

        .signup-btn {
            border-style: none;
            font-weight: 500;
            padding-left: 87px;
            padding-right: 87px;
            padding-top: 10px;
            padding-bottom: 10px;
            color: white;
            background-color: #2C64B6;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p class="email">Email</p>
    <input class="email-input">
    <p class="policy-statement">By clicking Agree & Join, you agree to the Privacy Policy.</p>
    <button class="signup-btn">Agree & Join</button>
</body>
</html>
