<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Practice #something</title>

    <style>
        .profile-card {
            font-family: Arial, Helvetica, sans-serif;
            width: 200px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.377);
            display: inline-block;
            margin-right: 10px;
        }

        .profile-picture {
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: center;
            margin-bottom: -15px;
        }

        .name {
            font-weight: bold;
            padding-left: 5px;
            font-size: 18px;
            margin-bottom: -15px;
        }

        .mutuals {
            padding-left: 6.5px;
            color: grey;
            font-size: 14px;
            font-weight: 500;
        }

        .add-friend-btn {
            font-size: 10px;
            font-weight: 400;
            border: none;
            color: white;
            padding: 7px 15px;
            background-color: #3975E3;
            margin-left: 5px;
            margin-bottom: 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <img class="profile-picture" src="pfp1.jpg">
        <p class="name">Oliver</p>
        <p class="mutuals">2 mutual friends</p>
        <button class="add-friend-btn">Add Friend</button>
    </div>
</body>
</html>
