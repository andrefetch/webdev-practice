<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Post</title>

    <style>

        div {
            width: 370px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.432);
            border-radius: 8px;
            padding: 10px 10px;
        }

        .profile-pic {
            vertical-align: middle;
            width: 40px;
            height: 40px;
            object-fit: cover;
            object-position: left;
            border-radius: 25px;
            margin-right: 5px;
        }

        .post-box {
            border-style: none;
            font-weight: 500;
            color: #696969;
            vertical-align: middle;
            padding-right: 60px;
        }

        .post-button {
            vertical-align: middle;
            border-style: none;
            background-color: #4A99E4;
            color: white;
            font-weight: bold;
            border-radius: 20px;
            padding-left: 15px;
            padding-right: 15px;
            padding-top: 5px;
            padding-bottom: 5px;
        }
    </style>
</head>
<body>
    <div>
        <img class="profile-pic" src="cat.jpg">
        <input class="post-box" type="text" placeholder="What's happening?">
        <button class="post-button">Tweet</button>
    </div>
</body>
</html>
