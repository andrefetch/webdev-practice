<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Practice #4</title>

    <style>
        div {
            font-family: Arial, Helvetica, sans-serif;
            width: 380px;
            padding-bottom: 5px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 5px;
            border: none;
            background-color: #212121;
        }

        .ad-title {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            margin-top: 10px;
        }

        .ad-desc {
            color: #868686;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div>
        <p class="ad-title">Install Youtube Music</p>
        <p class="ad-desc">Add Youtube Music to your desktop for quick and easy access</p>
    </div>
</body>
</html>
